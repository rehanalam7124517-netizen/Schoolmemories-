name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build The OG Legends APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Compute APK release version
        id: ver
        run: |
          CODE=$((100 + github.run_number))
          NAME="15.9.${{ github.run_number }}"
          FEED_URL="https://github.com/${{ github.repository }}/releases/download/latest/apk-update.json"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/The-OG-Legends-Android.apk"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "feed_url=$FEED_URL" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Build web assets & sync Capacitor Android
        env:
          VITE_APK_UPDATE_URL: ${{ steps.ver.outputs.feed_url }}
        run: |
          rm -rf dist android/app/src/main/assets/public
          npm run build
          npx cap sync android

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionCode=${{ steps.ver.outputs.code }} -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Prepare APK & update feed
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/The-OG-Legends-Android.apk
          node -e '
            const fs = require("fs");
            const payload = {
              versionCode: Number(process.env.CODE),
              versionName: process.env.NAME,
              apkUrl: process.env.APK_URL,
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync("release-apk/apk-update.json", JSON.stringify(payload, null, 2));
          '
          ls -lh release-apk/
        env:
          CODE: ${{ steps.ver.outputs.code }}
          NAME: ${{ steps.ver.outputs.name }}
          APK_URL: ${{ steps.ver.outputs.apk_url }}

      - name: Publish rolling latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: The OG Legends Latest APK
          body: Automatic build ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
          files: |
            release-apk/The-OG-Legends-Android.apk
            release-apk/apk-update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-OG-Legends-APK
          path: release-apk/The-OG-Legends-Android.apk
          if-no-files-found: error
          retention-days: 30
